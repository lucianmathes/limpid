[metadata]
name = LIMPID
version = attr: limpid.__version__
author = Michael Goeldl, Lucian Mathes
author_email = lucian.mathes@frm2.tum.de
description = A package for fitting positron annihilation Doppler broadening depth profiles.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://gitlab.lrz.de/positronis/limpid
project_urls =
    Bug Tracker = https://gitlab.lrz.de/positronis/limpid/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: GNU GPLv3
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.6

[options.packages.find]
where = src
