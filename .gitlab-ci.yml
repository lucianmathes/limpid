default:
    image: python:3.7
    before_script:
        - apt-get update
        - apt-get install -y python3-pip
        - pip install --upgrade pip
        - pip install -r requirements.txt
        - pip install .
stages:
    - test
    - dummy
test:
    script:
        - coverage run -m unittest discover -s tests/unit
        - coverage report
dummy:
    script:
        - echo "Pipeline finished"
